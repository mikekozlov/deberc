<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Дебертц</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#0f141b; --surface:#171f2a; --surface2:#1f2937; --border:rgba(255,255,255,0.09);
  --text:#eef2f7; --text2:#aeb9c8; --muted:#7d8899; --grid:#26303e;
  --t0:#c98500; --t1:#3987e5; --t0-soft:rgba(201,133,0,0.14); --t1-soft:rgba(57,135,229,0.14);
  --danger:#e66767; --good:#0ca30c; --red:#e66767; --black:#cfd6df;
}
html,body { height:100%; }
body {
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:17px;
  position:fixed; inset:0; overflow:hidden; width:100%;
  overscroll-behavior:none; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
input { user-select:text; -webkit-user-select:text; }
button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; touch-action:manipulation; }
#app { height:100dvh; display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
.hdr { display:flex; align-items:center; gap:8px; padding:10px 12px; min-height:56px; flex:0 0 auto; }
.hdr.center { justify-content:center; }
.brand { font-size:26px; font-weight:800; letter-spacing:0.5px; }
.htitle { font-size:19px; font-weight:700; flex:1; text-align:center; }
.hbtn { width:48px; height:44px; border-radius:12px; font-size:26px; color:var(--text2); flex:0 0 auto; }
.hbtn:active { background:var(--surface2); }
.hspace { width:48px; flex:0 0 auto; }
.content { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:8px 16px calc(24px + env(safe-area-inset-bottom)); width:100%; max-width:760px; margin:0 auto; }
.content.pad-fab { padding-bottom:calc(110px + env(safe-area-inset-bottom)); }
.bigbtn { display:block; width:100%; min-height:64px; margin:12px 0; border-radius:16px;
  background:var(--surface); border:1px solid var(--border); font-size:19px; font-weight:600; }
.bigbtn:active { background:var(--surface2); }
.bigbtn.primary { background:var(--t1); border-color:transparent; color:#fff; }
.bigbtn.primary:active { filter:brightness(1.15); }
.btn { min-height:48px; padding:10px 20px; border-radius:12px; background:var(--surface2);
  border:1px solid var(--border); font-weight:600; font-size:16px; }
.btn:active { filter:brightness(1.2); }
.btn.primary { background:var(--t1); border-color:transparent; color:#fff; }
.btn.danger { background:var(--danger); border-color:transparent; color:#fff; }
.btn.ghost { background:transparent; }
.btn.small { min-height:36px; padding:6px 14px; font-size:14px; }
.btn[disabled] { opacity:0.4; pointer-events:none; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px; margin:12px 0; }
.notice { display:flex; gap:10px; align-items:flex-start; font-size:14px; color:var(--text2); line-height:1.45; }
.notice .nx { margin-left:auto; font-size:20px; color:var(--muted); padding:0 4px; flex:0 0 auto; }
.sec { margin:20px 0; }
.sec-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
.cont-card { display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:16px; margin:12px 0; }
.cont-card:active { background:var(--surface2); }
.cc-label { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.cc-score { display:flex; align-items:center; gap:10px; font-size:16px; }
.cc-score b { font-size:22px; white-space:nowrap; }
.cc-score span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text2); }
.cc-score span:last-child { text-align:right; }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:1px; }
.dot.d0 { background:var(--t0); } .dot.d1 { background:var(--t1); }
.board { display:flex; gap:10px; align-items:stretch; margin:8px 0 16px; }
.team-card { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:12px 8px 14px; text-align:center; border-top:4px solid var(--t0); min-width:0; }
.team-card.tc1 { border-top-color:var(--t1); }
.tc-name { font-size:14px; color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 4px; }
.tc-score { font-size:52px; font-weight:800; line-height:1.15; font-variant-numeric:tabular-nums; }
.tc-crown { font-size:24px; }
.pbar { height:5px; background:var(--surface2); border-radius:3px; margin:8px 10px 0; overflow:hidden; }
.pbar i { display:block; height:100%; border-radius:3px; background:var(--t0); }
.tc1 .pbar i { background:var(--t1); }
.round-row { display:flex; align-items:center; width:100%; gap:6px; padding:11px 10px; border-radius:12px;
  background:var(--surface); border:1px solid var(--border); margin:6px 0; text-align:center; }
.round-row:active { background:var(--surface2); }
.rn { width:26px; color:var(--muted); font-size:14px; flex:0 0 auto; }
.rsuit { width:30px; font-size:21px; flex:0 0 auto; }
.rtaker { flex:0 0 24%; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  text-align:left; font-size:14px; font-weight:700; color:var(--t0); }
.rtaker.rt1 { color:var(--t1); }
.rp { flex:1; font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; }
.rp i { display:block; font-style:normal; font-weight:400; font-size:12px; color:var(--muted); }
.bait-badge { display:inline-block; font-size:11px; font-weight:800; color:#fff; background:var(--danger);
  border-radius:6px; padding:1px 6px; vertical-align:2px; margin-left:5px; }
.suit-red { color:var(--red); } .suit-black { color:var(--black); }
.fab-wrap { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 60%, transparent); display:flex; justify-content:center; z-index:20; }
.fab { width:100%; max-width:500px; min-height:60px; border-radius:16px; background:var(--t1); color:#fff;
  font-size:20px; font-weight:700; box-shadow:0 6px 24px rgba(0,0,0,0.45); }
.fab:active { filter:brightness(1.15); }
.team-box { border:1px solid var(--border); border-radius:16px; padding:12px; margin:10px 0; background:var(--surface); border-left:4px solid var(--t0); }
.team-box.tb1 { border-left-color:var(--t1); }
.tb-title { font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.slots { display:flex; gap:10px; }
.slot { flex:1; min-height:56px; border-radius:12px; border:1.5px dashed var(--grid); color:var(--muted);
  display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; padding:4px; }
.slot.filled { border-style:solid; border-color:var(--border); background:var(--surface2); color:var(--text); }
.slot.filled:active { background:var(--bg); }
.chips { display:flex; flex-wrap:wrap; gap:10px; }
.chip { min-height:48px; padding:10px 18px; border-radius:24px; background:var(--surface); border:1px solid var(--border); font-weight:600; }
.chip:active { background:var(--surface2); }
.chip.add { color:var(--t1); border-style:dashed; }
.tinput { width:140px; min-height:52px; background:var(--surface); border:1px solid var(--border); border-radius:12px;
  color:var(--text); font-size:20px; font-weight:700; text-align:center; padding:8px; }
.tinput:focus { outline:none; border-color:var(--t1); }
.sheet-backdrop { position:fixed; inset:0; background:rgba(5,8,12,0.72); z-index:50; }
.sheet { position:fixed; inset:0; z-index:51; display:flex; flex-direction:column; background:var(--bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
.sheet-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 16px 20px; width:100%; max-width:680px; margin:0 auto; }
.sheet-foot { flex:0 0 auto; padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--bg); border-top:1px solid var(--border); display:flex; justify-content:center; }
.sheet-foot .btn { width:100%; max-width:500px; min-height:58px; font-size:19px; }
.takers { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.taker { border-radius:14px; padding:10px 4px; background:var(--surface); border:2px solid var(--border);
  display:flex; flex-direction:column; align-items:center; gap:6px; min-height:96px; }
.taker .av { width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:20px; font-weight:800; background:var(--surface2); }
.taker.tt0 .av { background:var(--t0-soft); color:var(--t0); }
.taker.tt1 .av { background:var(--t1-soft); color:var(--t1); }
.taker .tk-name { font-size:13px; color:var(--text2); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.taker.sel { border-color:var(--t1); background:var(--surface2); }
.taker.sel.tt0 { border-color:var(--t0); }
.suits { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.suitbtn { min-height:64px; font-size:34px; border-radius:14px; background:var(--surface); border:2px solid var(--border); }
.suitbtn.sel { border-color:var(--text2); background:var(--surface2); }
.decl-col { border-radius:14px; background:var(--surface); border:1px solid var(--border); padding:10px; border-top:3px solid var(--t0); }
.decl-col.dc1 { border-top-color:var(--t1); }
.decl-head { font-size:13px; font-weight:700; color:var(--text2); margin-bottom:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.decl-row { display:flex; align-items:center; justify-content:space-between; gap:6px; margin:8px 0; font-size:15px; color:var(--text2); }
.step { display:flex; align-items:center; gap:2px; }
.step button { width:42px; height:42px; border-radius:10px; background:var(--surface2); font-size:22px; color:var(--text); }
.step button:active { filter:brightness(1.3); }
.step b { width:30px; text-align:center; font-size:18px; }
.bella-btn { width:100%; min-height:44px; border-radius:10px; background:var(--surface2); border:1.5px solid var(--border);
  font-weight:600; font-size:15px; margin-top:4px; }
.bella-btn.on { border-color:var(--good); color:var(--good); background:rgba(12,163,12,0.12); }
.tricks { display:flex; gap:10px; margin-bottom:12px; }
.trick-box { flex:1; border-radius:14px; background:var(--surface); border:2px solid var(--border); padding:10px; text-align:center; }
.trick-box.active { border-color:var(--t0); }
.trick-box.tb1.active { border-color:var(--t1); }
.tb-name { font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tb-val { font-size:38px; font-weight:800; min-height:48px; font-variant-numeric:tabular-nums; }
.tb-val.empty { color:var(--muted); }
.kapot-btn { width:100%; min-height:40px; border-radius:10px; background:var(--surface2); font-size:14px; font-weight:600; color:var(--text2); }
.kapot-btn.on { background:var(--t0-soft); color:var(--t0); }
.tb1 .kapot-btn.on { background:var(--t1-soft); color:var(--t1); }
.numpad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:420px; margin:0 auto; }
.numpad.off { opacity:0.35; pointer-events:none; }
.numpad button { min-height:60px; border-radius:14px; background:var(--surface); border:1px solid var(--border); font-size:26px; font-weight:600; }
.numpad button:active { background:var(--surface2); }
.preview { display:flex; align-items:center; justify-content:center; gap:14px; margin:18px 0 6px;
  border-radius:14px; background:var(--surface); border:1px solid var(--border); padding:14px; }
.preview.dim { color:var(--muted); font-size:15px; }
.pv { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; }
.pv-sep { font-size:22px; color:var(--muted); }
.backdrop { position:fixed; inset:0; background:rgba(5,8,12,0.72); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; }
.modal { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:20px; }
.m-title { font-size:19px; font-weight:700; margin-bottom:8px; }
.m-body { color:var(--text2); font-size:15px; line-height:1.5; margin-bottom:8px; }
.m-input { width:100%; min-height:52px; margin:10px 0; background:var(--bg); border:1px solid var(--border); border-radius:12px;
  color:var(--text); font-size:18px; padding:10px 14px; }
.m-input:focus { outline:none; border-color:var(--t1); }
.m-btns { display:flex; gap:10px; justify-content:flex-end; margin-top:14px; }
.m-btns.stack { flex-direction:column; }
.m-btns.stack .btn { width:100%; }
.btn.danger-ghost { background:transparent; color:var(--danger); }
.victory { text-align:center; padding:40px 20px; }
.victory .vt { font-size:64px; }
.victory h2 { font-size:26px; margin:12px 0 6px; }
.victory .vs { font-size:40px; font-weight:800; margin:14px 0 30px; font-variant-numeric:tabular-nums; }
.victory .btn { width:100%; max-width:360px; margin:8px auto; display:block; }
#toast { position:fixed; left:0; right:0; bottom:calc(20px + env(safe-area-inset-bottom)); display:flex; justify-content:center;
  z-index:150; pointer-events:none; opacity:0; transform:translateY(12px); transition:all 0.25s; }
#toast.show { opacity:1; transform:none; pointer-events:auto; }
.toast-box { background:var(--surface2); border:1px solid var(--border); border-radius:14px; padding:12px 18px;
  font-size:15px; display:flex; align-items:center; gap:12px; box-shadow:0 6px 24px rgba(0,0,0,0.5); }
.gcard { display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:14px 16px; margin:10px 0; }
.gcard:active { background:var(--surface2); }
.gc-date { font-size:13px; color:var(--muted); margin-bottom:6px; }
.gc-line { display:flex; align-items:center; gap:10px; font-size:15px; color:var(--text2); }
.gc-line b { font-size:20px; color:var(--text); white-space:nowrap; font-variant-numeric:tabular-nums; }
.gc-line span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gc-line span:last-child { text-align:right; }
.gc-line .win { color:var(--text); font-weight:700; }
.tabs { display:flex; gap:8px; margin:4px 0 16px; }
.tab { flex:1; min-height:46px; border-radius:12px; background:var(--surface); border:1px solid var(--border); font-weight:600; font-size:15px; color:var(--text2); }
.tab.sel { background:var(--surface2); color:var(--text); border-color:var(--text2); }
.stat-scroll { overflow-x:auto; margin:0 -16px; padding:0 16px; }
.stat-table { width:100%; border-collapse:collapse; min-width:560px; }
.stat-table th { font-size:12px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); text-align:left; padding:8px 10px; border-bottom:1px solid var(--grid); white-space:nowrap; }
.stat-table td { padding:11px 10px; border-bottom:1px solid var(--grid); font-size:15px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.stat-table td.pname { font-weight:700; }
.wr { display:flex; align-items:center; gap:8px; min-width:120px; }
.wr-bar { flex:1; height:8px; border-radius:4px; background:var(--surface2); overflow:hidden; min-width:60px; }
.wr-bar i { display:block; height:100%; background:var(--t1); border-radius:4px; }
.wr span { font-size:14px; color:var(--text2); width:38px; text-align:right; }
.empty { text-align:center; color:var(--muted); padding:48px 20px; font-size:16px; line-height:1.5; }
.prow { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--grid); }
.prow span.pn { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.prow.arch span.pn { color:var(--muted); text-decoration:line-through; }
.prow .btn { flex:0 0 auto; }
.srow { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--grid); }
.srow .sl { color:var(--text2); font-size:15px; }
.file-btn { display:inline-flex; align-items:center; justify-content:center; }
.settings-foot { text-align:center; color:var(--muted); font-size:13px; margin-top:32px; }
.legend { display:flex; gap:18px; margin:6px 2px 8px; font-size:14px; color:var(--text2); }
.legend i { display:inline-block; width:12px; height:4px; border-radius:2px; margin-right:6px; vertical-align:3px; }
.legend .lg0 i { background:var(--t0); } .legend .lg1 i { background:var(--t1); }
.chart-wrap { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:10px 6px 4px; }
.chart { width:100%; height:auto; display:block; touch-action:pan-y; }
.chart .grid { stroke:var(--grid); stroke-width:1; }
.chart .tick { fill:var(--muted); font-size:12px; text-anchor:end; }
.chart .tick.end { text-anchor:end; }
.chart .target { stroke:var(--muted); stroke-width:1.5; stroke-dasharray:6 5; }
.chart .l0 { stroke:var(--t0); } .chart .l1 { stroke:var(--t1); }
.chart polyline { fill:none; stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
.chart .pt0 { fill:var(--t0); stroke:var(--surface); stroke-width:2; }
.chart .pt1 { fill:var(--t1); stroke:var(--surface); stroke-width:2; }
.chart .cross { stroke:var(--text2); stroke-width:1; stroke-dasharray:3 3; visibility:hidden; }
.chart-tip { position:absolute; top:8px; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--border);
  border-radius:10px; padding:6px 10px; font-size:13px; color:var(--text2); white-space:nowrap; visibility:hidden; pointer-events:none; }
.mu-row { padding:14px 0; border-bottom:1px solid var(--grid); }
.mu-names { display:flex; align-items:center; gap:10px; font-size:15px; }
.mu-names b { font-size:20px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.mu-names span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text2); }
.mu-names span:last-child { text-align:right; }
.mu-sub { font-size:13px; color:var(--muted); margin-top:4px; text-align:center; }
.chip.sel { background:var(--t1-soft); border-color:var(--t1); color:var(--t1); }
.dealer-tag { text-align:center; font-size:15px; color:var(--text2); margin:0 0 14px; }
.dealer-tag b { color:var(--text); }
.rd-row { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--grid); }
.rd-row:last-child { border-bottom:0; }
.rd-k { color:var(--muted); font-size:13px; flex:0 0 auto; }
.rd-v { color:var(--text); text-align:right; font-size:15px; }
.rd-note { display:block; color:var(--muted); font-size:12px; }
.chip.own0.sel { background:var(--t0-soft); border-color:var(--t0); color:var(--t0); }
.chip.own1.sel { background:var(--t1-soft); border-color:var(--t1); color:var(--t1); }
.bella-row { display:flex; gap:10px; }

</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<script>
const APP_VERSION = '1.5.1';
const KEY = 'deberc.data';
const CUR_SCHEMA = 3;
const SYNC_URL = '/api/journal/deberc';
const DEAL_TOTAL = 162;
const DECL_PTS = { terz: 20, fifty: 50, bella: 20, deberc: 100 };
const LYZHA_LIMIT = 13;
const PENALTY = -100;
const FREE_BATONS = 2;
const SUITS = { s: '♠', c: '♣', h: '♥', d: '♦' };
const SUIT_NAMES = { s: 'пики', c: 'трефы', h: 'черви', d: 'бубны' };
const SUIT_CLS = { s: 'suit-black', c: 'suit-black', h: 'suit-red', d: 'suit-red' };
const MIGRATIONS = {
  1: d => {
    d.schemaVersion = 2;
    d.updatedAt = (d.players.length || d.games.length) ? nowIso() : '1970-01-01T00:00:00.000Z';
    if (d.settings.lastBackupAt) { try { localStorage.setItem('deberc.backupAt', d.settings.lastBackupAt); } catch {} }
    if (d.settings.hintDismissed) { try { localStorage.setItem('deberc.hint', '1'); } catch {} }
    delete d.settings.lastBackupAt;
    delete d.settings.hintDismissed;
    return d;
  },
  2: d => {
    d.schemaVersion = 3;

function defaults() {

  try {

    if (d.schemaVersion > CUR_SCHEMA) {

      return;

  } catch {

    data = defaults();
    setTimeout(() => uiAlert('Данные повреждены', 'Не удалось прочитать сохранённые данные. Они отложены в резервный слот, приложение начато с чистого листа. Если есть бэкап — импортируйте его в Настройках.'), 100);

const syncState = { pushedAt: null, pulledAt: null, error: null, busy: false };

async function fetchCloudData() {

}
function applyCloud(d) {

}
async function pullCloud(force = false, auto = false) {
  if (syncState.busy) return false;
  if (auto && Date.now() - lastPullTry < 20000) return false;
  lastPullTry = Date.now();
  syncState.busy = true;
  try {
    const d = await fetchCloudData();
    syncState.pulledAt = nowIso();
    syncState.error = null;
    if (d && (force || (d.updatedAt || '') > (data.updatedAt || ''))) {
      applyCloud(d);
      toast('Данные обновлены с сервера');
      return true;
    }
    if ((data.updatedAt || '') > ((d && d.updatedAt) || '')) schedulePush();
    return false;
  } catch (e) {

    return false;
  } finally {

  }
}
async function pushCloud() {
  if (storeLocked) return false;
  if (syncState.busy) { schedulePush(); return false; }
  syncState.busy = true;
  try {
    const res = await fetch(SYNC_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (res.status === 409) {
      const d = parseCloud(await res.json());
      if (d) { applyCloud(d); toast('На сервере данные новее — обновлено'); }
      return false;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    syncState.pushedAt = nowIso();
    syncState.error = null;
    return true;
  } catch (e) {
    syncState.error = String(e.message || e);

    return false;
  } finally {
    syncState.busy = false;

}

function emptyDecl() {

function seqPoints(d) {

}
function declPoints(d) {

function scoreRound(round, teams, batons = [0, 0]) {
  const takerTeam = teams.findIndex(t => t.includes(round.trumpTakerId));
  const raw = [0, 1].map(i => round.trickPoints[i] + (round.trickPoints[i] > 0 ? declPoints(round.declarations[i]) : 0));
  const lv = raw[0] < LYZHA_LIMIT ? 0 : raw[1] < LYZHA_LIMIT ? 1 : null;
  if (lv !== null) {
    const totals = [];
    totals[lv] = PENALTY;
    totals[1 - lv] = raw[1 - lv];
    return { totals, takerTeam, baton: null, batonNo: 0, lyzha: lv };
  }
  const opp = 1 - takerTeam;
  if (raw[takerTeam] < raw[opp]) {
    const no = batons[takerTeam] + 1;
    const totals = [];
    totals[takerTeam] = no > FREE_BATONS ? PENALTY : 0;
    totals[opp] = raw[0] + raw[1];
    return { totals, takerTeam, baton: takerTeam, batonNo: no, lyzha: null };
  }
  return { totals: raw, takerTeam, baton: null, batonNo: 0, lyzha: null };
}
function callFailed(s) {

}
function gameRows(game) {
  let cum = [0, 0];

  return game.rounds.map(r => {
    const s = scoreRound(r, game.teams, batons);
    if (s.baton !== null) batons[s.baton]++;
    cum = [cum[0] + s.totals[0], cum[1] + s.totals[1]];
    return { round: r, ...s, cum: [...cum] };

}
function batonsBefore(game, editId) {

    if (editId && r.id === editId) break;

    if (s.baton !== null) b[s.baton]++;

}
function seatingOrder(g) {

function dealerForRound(g, idx) {

const CH = { W: 640, H: 300, L: 48, R: 16, T: 16, B: 26 };
function tickStep(m) { for (const s of [50, 100, 200, 250, 500, 1000, 2000]) if (m / s <= 6) return s; return 5000; }
function chartSvg(g, rows) {
  const n = rows.length;
  if (!n) return '';
  const allC = rows.flatMap(r => r.cum);
  const maxY = Math.max(g.target, ...allC) * 1.06;
  const minY = Math.min(0, ...allC);
  const X = i => CH.L + (CH.W - CH.L - CH.R) * i / n;
  const Y = v => CH.H - CH.B - (CH.H - CH.T - CH.B) * (v - minY) / (maxY - minY);
  const line = t => [[0, 0]].concat(rows.map((r, i) => [i + 1, r.cum[t]])).map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ');
  const step = tickStep(maxY - minY);
  let grid = '';
  for (let v = Math.ceil(minY / step) * step; v <= maxY; v += step) grid += `<line class="grid" x1="${CH.L}" x2="${CH.W - CH.R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="tick" x="${CH.L - 8}" y="${(Y(v) + 4).toFixed(1)}">${v}</text>`;
  const ty = Y(g.target).toFixed(1);
  const end = t => `<circle class="pt${t}" cx="${X(n).toFixed(1)}" cy="${Y(rows[n - 1].cum[t]).toFixed(1)}" r="4.5"/>`;
  return `<div class="legend"><span class="lg0"><i></i>${esc(teamNames(g, 0))}</span><span class="lg1"><i></i>${esc(teamNames(g, 1))}</span></div>
  <div class="chart-wrap">
    <svg class="chart" viewBox="0 0 ${CH.W} ${CH.H}" data-n="${n}" data-gid="${g.id}">
      ${grid}
      <line class="target" x1="${CH.L}" x2="${CH.W - CH.R}" y1="${ty}" y2="${ty}"/>
      <polyline class="l0" points="${line(0)}"/>
      <polyline class="l1" points="${line(1)}"/>
      ${end(0)}${end(1)}
      <line class="cross" x1="0" x2="0" y1="${CH.T}" y2="${CH.H - CH.B}"/>
    </svg>
    <div class="chart-tip"></div>
  </div>`;
}
function bindChart() {
  const svg = document.querySelector('svg.chart');
  if (!svg) return;
  const g = data.games.find(x => x.id === svg.dataset.gid);
  if (!g) return;
  const rows = gameRows(g);
  const n = rows.length;
  const tip = document.querySelector('.chart-tip');
  const cross = svg.querySelector('.cross');
  const show = e => {
    const rect = svg.getBoundingClientRect();
    const fx = (e.clientX - rect.left) / rect.width * CH.W;
    let i = Math.round((fx - CH.L) / ((CH.W - CH.L - CH.R) / n));
    i = Math.max(1, Math.min(n, i));
    const x = CH.L + (CH.W - CH.L - CH.R) * i / n;
    cross.setAttribute('x1', x); cross.setAttribute('x2', x);
    cross.style.visibility = 'visible';
    const r = rows[i - 1];
    const dd = v => (v >= 0 ? '+' : '') + v;
    tip.textContent = `Раунд ${i}: ${dd(r.totals[0])} / ${dd(r.totals[1])} · счёт ${r.cum[0]} : ${r.cum[1]}`;
    tip.style.left = Math.max(18, Math.min(82, x / CH.W * 100)) + '%';
    tip.style.visibility = 'visible';
  };
  const hide = () => { cross.style.visibility = 'hidden'; tip.style.visibility = 'hidden'; };
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'mouse') show(e); });
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('pointerup', () => setTimeout(hide, 1800));
}

function streaks(seq) {
  let cur = 0, best = 0, run = 0;
  for (const w of seq) { run = w ? run + 1 : 0; if (run > best) best = run; }
  for (let i = seq.length - 1; i >= 0 && seq[i]; i--) cur++;
  return { cur, best };
}
function computeStats() {
  const games = finishedGames().slice().sort((a, b) => (a.finishedAt < b.finishedAt ? -1 : 1));
  const P = {}, PAIR = {}, MU = {};
  for (const g of games) {
    const keys = g.teams.map(t => t.slice().sort().join('|'));
    for (let ti = 0; ti < 2; ti++) {
      const win = g.winnerTeam === ti;
      for (const pid of g.teams[ti]) {
        const s = P[pid] ??= { games: 0, wins: 0, calls: 0, callWins: 0, batons: 0, seq: [] };
        s.games++; if (win) s.wins++; s.seq.push(win);
      }
      const pk = PAIR[keys[ti]] ??= { key: keys[ti], games: 0, wins: 0 };
      pk.games++; if (win) pk.wins++;
    }
    const mk = keys.slice().sort().join('~');
    const m = MU[mk] ??= { keys: keys.slice().sort(), games: 0, wins: {} };
    m.games++;
    m.wins[keys[g.winnerTeam]] = (m.wins[keys[g.winnerTeam]] || 0) + 1;
    const batons = [0, 0];
    for (const r of g.rounds) {
      const sc = scoreRound(r, g.teams, batons);
      if (sc.baton !== null) batons[sc.baton]++;
      const ps = P[r.trumpTakerId];
      if (ps) {
        ps.calls++;
        if (!callFailed(sc)) ps.callWins++;
        if (sc.baton !== null) ps.batons++;
      }
    }
  }
  return { P, PAIR, MU };
}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const wrHtml = p => `<div class="wr"><div class="wr-bar"><i style="width:${p}%"></i></div><span>${p}%</span></div>`;
const pairLabel = key => key.split('|').map(playerName).join(' + ');
function renderStats() {

  </div>`;
  let body = '';

  else if (statsTab === 'players') {

      .sort((a, b) => pct(b[1].wins, b[1].games) - pct(a[1].wins, a[1].games) || b[1].games - a[1].games)
      .map(([pid, s]) => {

      }).join('');
    body = `<div class="stat-scroll"><table class="stat-table">
      <thead><tr><th>Игрок</th><th>Игры</th><th>Победы</th><th>Винрейт</th><th>Серия</th><th>Заказы (успех)</th><th title="Заказал козырь и получил батон">Батоны</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  } else if (statsTab === 'pairs') {

    body = `<div class="stat-scroll"><table class="stat-table" style="min-width:420px">

      <tbody>${rows}</tbody></table></div>`;
  } else {

      </div>`;
    }).join('') || '<div class="empty">Встреч пока нет</div>';
  }

  const pad = `<div class="numpad ${sheet.kapot !== null ? 'off' : ''}">
    ${[1,2,3,4,5,6,7,8,9].map(d => `<button data-action="pad" data-d="${d}">${d}</button>`).join('')}
    <button data-action="pad" data-d="clear">C</button><button data-action="pad" data-d="0">0</button><button data-action="pad" data-d="back">⌫</button>
  </div>`;
  let preview;
  if (sheet.takerId && tp) {
    const s = scoreRound(sheetRound(tp), g.teams, batonsBefore(g, sheet.editId));
    const badge = t => (s.baton === t ? ` <span class="bait-badge">БАТОН №${s.batonNo}${s.batonNo > FREE_BATONS ? ' · −100' : ''}</span>` : '')
      + (s.lyzha === t ? ' <span class="bait-badge">ЛЫЖА</span>' : '');
    preview = `<div class="preview"><div class="pv" style="color:var(--t0)">${s.totals[0]}${badge(0)}</div><div class="pv-sep">:</div><div class="pv" style="color:var(--t1)">${s.totals[1]}${badge(1)}</div></div>`;
  } else preview = '<div class="preview dim">Итог раунда появится после ввода</div>';
  const n = sheet.editId ? g.rounds.findIndex(r => r.id === sheet.editId) + 1 : g.rounds.length + 1;
  const dl = dealerForRound(g, n - 1);
  return `<div class="sheet-backdrop"></div><div class="sheet">
    <div class="hdr"><button class="hbtn" data-action="sheetClose">✕</button><div class="htitle">Раунд ${n}</div><div class="hspace"></div></div>
    <div class="sheet-body">
      ${dl ? `<div class="dealer-tag">🃏 Раздаёт: <b>${esc(playerName(dl))}</b></div>` : ''}
      <div class="sec"><div class="sec-title">Кто заказал козырь</div><div class="takers">${takers}</div></div>
      <div class="sec"><div class="sec-title">Козырь</div><div class="suits">${suits}</div></div>
      <div class="sec"><div class="sec-title">Комбинации — у кого старшая</div>${declSec}</div>
      <div class="sec"><div class="sec-title">Очки за взятки (всего ${DEAL_TOTAL})</div><div class="tricks">${trickBox(0)}${trickBox(1)}</div>${pad}</div>
      ${preview}
    </div>
    <div class="sheet-foot"><button class="btn primary" data-action="sheetSave" ${sheetValid() ? '' : 'disabled'}>Записать</button></div>
  </div>`;
}
function renderVictory() {
  const g = data.games.find(x => x.id === victory);
  if (!g) return '';
  const t = gameTotals(g);
  const w = g.winnerTeam;
  return `<div class="sheet-backdrop"></div><div class="sheet"><div class="sheet-body victory">
    <div class="vt">🏆</div>
    <h2>${esc(teamNames(g, w))}</h2>
    <div style="color:var(--muted)">победа в игре до ${g.target}</div>
    <div class="vs"><span style="color:var(--t0)">${t[0]}</span> : <span style="color:var(--t1)">${t[1]}</span></div>
    <button class="btn primary" data-action="victoryDone">Готово</button>
    <button class="btn ghost" data-action="victoryFix">Исправить последний раунд</button>
  </div></div>`;
}
function renderOverlays() {
  document.getElementById('sheet-root').innerHTML = victory ? renderVictory() : (sheet ? renderSheet() : '');
}
function updateSheet() {
  const el = document.querySelector('.sheet-body');
  const st = el ? el.scrollTop : 0;
  renderOverlays();
  const el2 = document.querySelector('.sheet-body');
  if (el2) el2.scrollTop = st;
}

function render() {
  let r = route();
  if (r === 'game' && !activeGame()) { location.replace('#home'); return; }
  const app = document.getElementById('app');
  if (r === 'home') app.innerHTML = renderHome();
  else if (r === 'new') app.innerHTML = renderNew();
  else if (r === 'game') app.innerHTML = renderGame();
  else if (r === 'history') app.innerHTML = renderHistory();
  else if (r.startsWith('game-view/')) app.innerHTML = renderGameView(r.slice(10));
  else if (r === 'stats') app.innerHTML = renderStats();
  else if (r === 'settings') app.innerHTML = renderSettings();
  else { location.replace('#home'); return; }
  if (r.startsWith('game-view/')) bindChart();
  syncWakeLock();
}

async function addPlayerFlow() {
  const name = await uiPrompt('Имя игрока');
  if (!name) return null;
  if (data.players.some(p => p.name.toLowerCase() === name.toLowerCase())) { toast('Такой игрок уже есть'); return null; }
  const p = { id: uid('p'), name, createdAt: nowIso(), archived: false };
  data.players.push(p);
  save();
  return p;
}
function finishGame(g, w) {
  g.status = 'finished';
  g.winnerTeam = w;
  g.finishedAt = nowIso();
  save();
  sheet = null;
  victory = g.id;
  renderOverlays();
  render();
}

const ACTIONS = {
  nav: d => nav(d.to),
  hintDismiss: () => { try { localStorage.setItem('deberc.hint', '1'); } catch {} render(); },
  reloadApp: () => location.reload(),
  goNew: async () => {
    const g = activeGame();
    if (g) {
      const ok = await uiConfirm('Незавершённая игра', 'Начать новую можно, только удалив текущую игру. Удалить её без сохранения?', 'Удалить и начать', true);
      if (!ok) return;
      data.games = data.games.filter(x => x !== g);
      save();
    }
    NG = { slots: [null, null, null, null], target: String(data.settings.defaultTarget) };
    nav('new');
  },
  pickPlayer: d => {
    const i = NG.slots.indexOf(null);
    if (i === -1) return;
    NG.slots[i] = d.pid;
    render();
  },
  clearSlot: d => { if (NG.dealer === NG.slots[+d.i]) NG.dealer = null; NG.slots[+d.i] = null; render(); },
  pickDealer: d => { NG.dealer = d.pid; render(); },
  addPlayerNew: async () => {
    const p = await addPlayerFlow();
    if (p) { const i = NG.slots.indexOf(null); if (i !== -1) NG.slots[i] = p.id; }
    render();
  },
  startGame: () => {
    if (!NG.slots.every(Boolean) || !NG.dealer) return;
    const t = parseInt(NG.target, 10);
    if (!(t >= 50)) { toast('Некорректная цель игры'); return; }
    data.games.push({
      id: uid('g'), createdAt: nowIso(), finishedAt: null, status: 'active',
      target: t, teams: [[NG.slots[0], NG.slots[1]], [NG.slots[2], NG.slots[3]]],
      firstDealerId: NG.dealer, winnerTeam: null, rounds: []
    });
    save();
    NG = null;
    nav('game');
  },
  openSheet: () => {
    sheet = { editId: null, takerId: null, suit: null, decl: [emptyDecl(), emptyDecl()], declOwner: null, side: 0, tricksStr: '', kapot: null };
    renderOverlays();
  },
  roundInfo: async d => {
    const g = data.games.find(x => x.id === d.gid);
    if (!g) return;
    const idx = g.rounds.findIndex(r => r.id === d.rid);
    if (idx < 0) return;
    const buttons = [{ key: 'close', label: 'Закрыть', cls: 'ghost' }];
    if (g.status === 'active') buttons.push({ key: 'edit', label: 'Исправить', cls: 'primary' });
    const res = await modal({ title: 'Раунд ' + (idx + 1), body: roundDetailsHtml(g, gameRows(g), idx), buttons });
    if (res.key === 'edit') ACTIONS.editRound({ rid: d.rid });
  },
  editRound: d => {
    const g = activeGame();
    const r = g.rounds.find(x => x.id === d.rid);
    if (!r) return;
    const decl = [{ ...emptyDecl(), ...r.declarations[0] }, { ...emptyDecl(), ...r.declarations[1] }];
    sheet = {
      editId: r.id, takerId: r.trumpTakerId, suit: r.trumpSuit,
      decl, declOwner: seqPoints(decl[0]) >= seqPoints(decl[1]) ? (seqPoints(decl[0]) ? 0 : null) : 1,
      side: 0, tricksStr: String(r.trickPoints[0]), kapot: r.kapot ?? allTricksTeam(r)
    };
    renderOverlays();
  },
  sheetClose: () => { sheet = null; renderOverlays(); },
  sheetTaker: d => { sheet.takerId = d.pid; updateSheet(); },
  sheetSuit: d => { sheet.suit = d.s; updateSheet(); },
  declOwner: d => {
    const t = d.t === '' ? null : +d.t;
    const from = sheet.declOwner;
    const seq = from === null ? { terz: 0, fifty: 0, deberc: 0 } : { terz: sheet.decl[from].terz, fifty: sheet.decl[from].fifty, deberc: sheet.decl[from].deberc };
    [0, 1].forEach(i => Object.assign(sheet.decl[i], { terz: 0, fifty: 0, deberc: 0 }));
    if (t !== null) Object.assign(sheet.decl[t], seq);
    sheet.declOwner = t;
    updateSheet();
  },
  declStep: d => {
    const t = sheet.declOwner;
    if (t === null) return;
    const max = d.kind === 'terz' ? 4 : 2;
    sheet.decl[t][d.kind] = Math.max(0, Math.min(max, (sheet.decl[t][d.kind] || 0) + (+d.d)));
    updateSheet();
  },
  bella: d => {
    const t = +d.t;
    sheet.decl[t].bella = !sheet.decl[t].bella;
    if (sheet.decl[t].bella) sheet.decl[1 - t].bella = false;
    updateSheet();
  },
  sheetSide: d => {
    if (sheet.kapot !== null) return;
    const t = +d.i;
    if (sheet.side === t) return;
    const tp = sheetTricks();
    sheet.side = t;
    sheet.tricksStr = tp ? String(tp[t]) : '';
    updateSheet();
  },
  kapot: d => {
    const t = +d.t;
    sheet.kapot = sheet.kapot === t ? null : t;
    if (sheet.kapot === null) sheet.tricksStr = '';
    updateSheet();
  },
  pad: d => {
    if (d.d === 'clear') sheet.tricksStr = '';
    else if (d.d === 'back') sheet.tricksStr = sheet.tricksStr.slice(0, -1);
    else {
      const next = sheet.tricksStr === '0' ? d.d : sheet.tricksStr + d.d;
      if (next.length <= 3 && parseInt(next, 10) <= DEAL_TOTAL) sheet.tricksStr = next;
    }
    updateSheet();
  },
  sheetSave: async () => {
    if (!sheetValid()) return;
    const g = activeGame();
    const tp = sheetTricks();
    const base = sheetRound(tp);
    if (sheet.editId) {
      const i = g.rounds.findIndex(r => r.id === sheet.editId);
      g.rounds[i] = { ...base, id: sheet.editId, createdAt: g.rounds[i].createdAt };
    } else {
      g.rounds.push({ ...base, id: uid('r'), createdAt: nowIso() });
    }
    save();
    const w = detectWinner(gameTotals(g), g.target);
    if (w !== null) {
      if (sheet.editId) {
        sheet = null;
        renderOverlays();
        render();
        const ok = await uiConfirm('Цель достигнута', `Пара «${esc(teamNames(g, w))}» набрала ${gameTotals(g)[w]} из ${g.target}. Завершить игру?`, 'Завершить');
        if (ok) finishGame(g, w);
      } else finishGame(g, w);
    } else {
      sheet = null;
      renderOverlays();
      render();
    }
  },
  gameMenu: async () => {
    const g = activeGame();
    const items = [];
    if (g.rounds.length) items.push({ key: 'del', label: 'Удалить последний раунд', danger: true });
    items.push({ key: 'abort', label: 'Удалить игру', danger: true });
    const k = await uiMenu(items);
    if (k === 'del') {
      const ok = await uiConfirm('Удалить раунд', 'Последний раунд будет удалён.', 'Удалить', true);
      if (ok) { g.rounds.pop(); save(); render(); }
    } else if (k === 'abort') {
      const ok = await uiConfirm('Удалить игру', 'Игра будет удалена без сохранения результата.', 'Удалить', true);
      if (ok) { data.games = data.games.filter(x => x !== g); save(); nav('home'); }
    }
  },
  victoryDone: () => { victory = null; renderOverlays(); nav('home'); },
  victoryFix: () => {
    const g = data.games.find(x => x.id === victory);
    victory = null;
    g.status = 'active';
    g.winnerTeam = null;
    g.finishedAt = null;
    save();
    const last = g.rounds[g.rounds.length - 1];
    nav('game');
    render();
    ACTIONS.editRound({ rid: last.id });
  },
  statsTab: d => { statsTab = d.tab; render(); },
  addPlayer: async () => { await addPlayerFlow(); render(); },
  renamePlayer: async d => {
    const p = playerById(d.pid);
    const name = await uiPrompt('Имя игрока', p.name);
    if (name && !data.players.some(x => x.id !== p.id && x.name.toLowerCase() === name.toLowerCase())) {
      p.name = name;
      save();
    }
    render();
  },
  toggleArchive: d => {
    const p = playerById(d.pid);
    const g = activeGame();
    if (!p.archived && g && g.teams.flat().includes(p.id)) { toast('Игрок в текущей игре'); return; }
    p.archived = !p.archived;
    save();
    render();
  },
  exportData: () => doExport(),
  pullForce: async () => {
    const ok = await uiConfirm('Заменить серверными', 'Данные на этом устройстве будут заменены копией с сервера без сравнения дат.', 'Заменить', true);
    if (ok) await pullCloud(true);
  }
};

async function doExport() {
  const json = JSON.stringify(data, null, 2);
  const name = 'deberc-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  let done = false;
  if (navigator.canShare) {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); done = true; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
  }
  if (!done) {
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  try { localStorage.setItem('deberc.backupAt', nowIso()); } catch {}
  render();
  toast('Бэкап сохранён');
}
async function doImport(file) {
  let d;
  try { d = JSON.parse(await file.text()); }
  catch { return uiAlert('Ошибка', 'Файл не является корректным JSON.'); }
  if (typeof d.schemaVersion !== 'number' || !Array.isArray(d.players) || !Array.isArray(d.games)) return uiAlert('Ошибка', 'Это не файл бэкапа Дебертца.');
  if (d.schemaVersion > CUR_SCHEMA) return uiAlert('Ошибка', 'Бэкап создан более новой версией приложения.');
  d = migrate(d);
  const ok = await uiConfirm('Импорт данных', `Текущие данные (игр: ${data.games.length}, игроков: ${data.players.length}) будут заменены содержимым файла (игр: ${d.games.length}, игроков: ${d.players.length}).`, 'Заменить', true);
  if (!ok) return;
  try { localStorage.setItem('deberc.prev', JSON.stringify(data)); } catch {}
  data = d;
  save();
  render();
  toast('Данные импортированы');
}

async function syncWakeLock() {
  const want = route() === 'game' && document.visibilityState === 'visible';
  if (want && !wakeLock && 'wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch {}
  } else if (!want && wakeLock) {
    try { await wakeLock.release(); } catch {}
    wakeLock = null;
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el.dataset, el);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]');
  if (!el) return;
  if (el.dataset.input === 'newTarget' && NG) {
    NG.target = el.value.replace(/\D/g, '');
    const btn = document.querySelector('[data-action="startGame"]');
    if (btn) btn.disabled = !(NG.slots.every(Boolean) && parseInt(NG.target, 10) >= 50);
  }
  if (el.dataset.input === 'defaultTarget') {
    const v = parseInt(el.value.replace(/\D/g, ''), 10);
    if (v >= 50 && v <= 100000) { data.settings.defaultTarget = v; save(); }
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  if (el.dataset.change === 'importFile' && el.files[0]) { doImport(el.files[0]); el.value = ''; }
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', syncWakeLock);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pullCloud(false, true); });
setInterval(() => { if (!sheet && !victory && document.visibilityState === 'visible') pullCloud(false, true); }, 25000);
window.addEventListener('hashchange', render);
window.addEventListener('load', () => {
  if (!('serviceWorker' in navigator)) return;
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (had) toast('Доступно обновление', { sticky: true, btn: 'Обновить', action: 'reloadApp' });
  });
});

loadData();
try { localStorage.removeItem('deberc.token'); } catch {}
if (!location.hash) location.replace('#home');
render();
pullCloud(false, true);
</script>
</body>
</html>
