<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {

}
html,body { height:100%; }

}

#app { height:100dvh; display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
.hdr { display:flex; align-items:center; gap:8px; padding:10px 12px; min-height:56px; flex:0 0 auto; }

.brand { font-size:26px; font-weight:800; letter-spacing:0.5px; }
.htitle { font-size:19px; font-weight:700; flex:1; text-align:center; }

.hspace { width:48px; flex:0 0 auto; }
.content { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;

.rp { flex:1; font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; }

.suit-red { color:var(--red); } .suit-black { color:var(--black); }

.fab { width:100%; max-width:500px; min-height:60px; border-radius:16px; background:var(--t1-fill); color:#fff;
  font-size:20px; font-weight:700; box-shadow:0 6px 24px rgba(0,0,0,0.45); }
.fab:active { filter:brightness(1.15); }
.team-box { border:1px solid var(--border); border-radius:16px; padding:12px; margin:10px 0; background:var(--surface); border-left:4px solid var(--t0); }
.team-box.tb1 { border-left-color:var(--t1); }
.tb-title { font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.slots { display:flex; gap:10px; }
.slot { flex:1; min-height:56px; border-radius:12px; border:1.5px dashed var(--grid); color:var(--muted);

.slot.filled { border-style:solid; border-color:var(--border); background:var(--surface2); color:var(--text); }
.slot.filled:active { background:var(--bg); }
.chips { display:flex; flex-wrap:wrap; gap:10px; }
.chip { min-height:48px; padding:10px 18px; border-radius:24px; background:var(--surface); border:1px solid var(--border); font-weight:600; }
.chip:active { background:var(--surface2); }
.chip.add { color:var(--t1); border-style:dashed; }
.tinput { width:140px; min-height:52px; background:var(--surface); border:1px solid var(--border); border-radius:12px;

.sheet-backdrop { position:fixed; inset:0; background:rgba(5,8,12,0.72); z-index:50; }

  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
.sheet-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 16px 20px; width:100%; max-width:680px; margin:0 auto; }
.sheet-foot { flex:0 0 auto; padding:10px 16px calc(12px + env(safe-area-inset-bottom));

.takers { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }

.tb-name { font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.preview { display:flex; align-items:center; justify-content:center; gap:14px; margin:18px 0 6px;

.pv { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; }

.backdrop { position:fixed; inset:0; background:rgba(5,8,12,0.72); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; }
.modal { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:20px; }
.m-title { font-size:19px; font-weight:700; margin-bottom:8px; }

.file-btn { display:inline-flex; align-items:center; justify-content:center; }

<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<script>
const APP_VERSION = '1.7.2';
const KEY = 'deberc.data';
const CUR_SCHEMA = 4;
const SYNC_URL = '/api/journal/deberc';
const DEAL_TOTAL = 162;
const DECL_PTS = { terz: 20, fifty: 50, bella: 20, deberc: 100 };
const LYZHA_LIMIT = 13;
const PENALTY = -100;
const FREE_BATONS = 2;
const SUITS = { s: '♠', c: '♣', h: '♥', d: '♦' };
const SUIT_NAMES = { s: 'пики', c: 'трефы', h: 'черви', d: 'бубны' };
const SUIT_CLS = { s: 'suit-black', c: 'suit-black', h: 'suit-red', d: 'suit-red' };
const CALL_KINDS = [
  ['first', '1-й круг', 'заказал по вскрытой масти'],
  ['left', 'Оставили', 'раздающего оставили — заказ вынужденный'],
  ['own', 'Свои обязи', 'взял на 2-м круге, когда раздавала своя пара'],
  ['foreign', 'Чужие обязи', 'взял на 2-м круге, когда раздавала пара соперников']
];
const MIGRATIONS = {
  1: d => {
    d.schemaVersion = 2;
    d.updatedAt = (d.players.length || d.games.length) ? nowIso() : '1970-01-01T00:00:00.000Z';
    if (d.settings.lastBackupAt) { try { localStorage.setItem('deberc.backupAt', d.settings.lastBackupAt); } catch {} }
    if (d.settings.hintDismissed) { try { localStorage.setItem('deberc.hint', '1'); } catch {} }
    delete d.settings.lastBackupAt;
    delete d.settings.hintDismissed;
    return d;
  },
  2: d => {
    d.schemaVersion = 3;
    d.games.forEach(g => {
      g.firstDealerId ??= null;
      g.rounds.forEach(r => r.declarations.forEach(x => { x.deberc ??= 0; }));
    });
    return d;
  },
  3: d => {
    d.schemaVersion = 4;
    d.games.forEach(g => g.rounds.forEach(r => {
      r.declarers ??= null;
      r.callPhase ??= null;
      r.forced ??= false;
    }));
    return d;
  }
};
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const STANDALONE = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
let data = null;
let storeLocked = false;
let NG = null;
let sheet = null;
let victory = null;
let statsTab = 'players';
let toastTimer = null;
let wakeLock = null;
let freshRoundId = null;
let lastBoard = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const nowIso = () => new Date().toISOString();

function defaults() {
  return { schemaVersion: CUR_SCHEMA, updatedAt: '1970-01-01T00:00:00.000Z', settings: { defaultTarget: 1010 }, players: [], games: [] };
}
function migrate(d) {
  while (d.schemaVersion < CUR_SCHEMA) d = MIGRATIONS[d.schemaVersion](d);
  return d;
}
function loadData() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch {}
  if (!raw) { data = defaults(); return; }
  try {
    let d = JSON.parse(raw);
    if (typeof d.schemaVersion !== 'number' || !Array.isArray(d.players) || !Array.isArray(d.games)) throw new Error('shape');
    if (d.schemaVersion > CUR_SCHEMA) {
      data = defaults();
      storeLocked = true;
      setTimeout(() => uiAlert('Данные новее приложения', 'Сохранённые данные созданы более новой версией. Обновите приложение — сохранение отключено, чтобы ничего не потерять.'), 100);
      return;
    }
    data = migrate(d);
  } catch {
    try { localStorage.setItem('deberc.corrupt', raw); } catch {}
    data = defaults();
    setTimeout(() => uiAlert('Данные повреждены', 'Не удалось прочитать сохранённые данные. Они отложены в резервный слот, приложение начато с чистого листа. Если есть бэкап — импортируйте его в Настройках.'), 100);
  }
}
function save(stamp = true) {
  if (storeLocked) return;
  if (stamp) data.updatedAt = nowIso();
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch { uiAlert('Ошибка сохранения', 'Не удалось сохранить данные. Срочно сделайте экспорт в Настройках.'); }
  if (stamp) schedulePush();
}

const syncState = { pushedAt: null, pulledAt: null, error: null, busy: false };
let pushTimer = null;
let lastPullTry = 0;
function schedulePush() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushCloud, 4000);
}
function parseCloud(d) {
  if (!d || typeof d.schemaVersion !== 'number' || !Array.isArray(d.players) || !Array.isArray(d.games)) return null;
  if (d.schemaVersion > CUR_SCHEMA) throw new Error('данные на сервере новее приложения — обновите приложение');
  return migrate(d);
}
async function fetchCloudData() {
  const res = await fetch(SYNC_URL, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return parseCloud(await res.json());
}
function applyCloud(d) {
  data = d;
  save(false);
  render();
}
async function pullCloud(force = false, auto = false) {
  if (syncState.busy) return false;
  if (auto && Date.now() - lastPullTry < 20000) return false;
  lastPullTry = Date.now();
  syncState.busy = true;
  try {
    const d = await fetchCloudData();
    syncState.pulledAt = nowIso();
    syncState.error = null;
    if (d && (force || (d.updatedAt || '') > (data.updatedAt || ''))) {
      applyCloud(d);
      toast('Данные обновлены с сервера');
      return true;
    }
    if ((data.updatedAt || '') > ((d && d.updatedAt) || '')) schedulePush();
    return false;
  } catch (e) {
    syncState.error = String(e.message || e);
    return false;
  } finally {
    syncState.busy = false;
    if (route() === 'settings' || route() === 'home') render();
  }
}
async function pushCloud() {
  if (storeLocked) return false;
  if (syncState.busy) { schedulePush(); return false; }
  syncState.busy = true;
  try {
    const res = await fetch(SYNC_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (res.status === 409) {
      const d = parseCloud(await res.json());
      if (d) { applyCloud(d); toast('На сервере данные новее — обновлено'); }
      return false;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    syncState.pushedAt = nowIso();
    syncState.error = null;
    return true;
  } catch (e) {
    syncState.error = String(e.message || e);
    toast('Не удалось отправить на сервер');
    return false;
  } finally {
    syncState.busy = false;
    if (route() === 'settings' || route() === 'home') render();
  }
}

function emptyDecl() {
  return { terz: 0, fifty: 0, deberc: 0, bella: false };
}
function seqPoints(d) {
  return (d.terz || 0) * DECL_PTS.terz + (d.fifty || 0) * DECL_PTS.fifty + (d.deberc || 0) * DECL_PTS.deberc;
}
function declPoints(d) {
  return seqPoints(d) + (d.bella ? DECL_PTS.bella : 0);
}
function teamDecl(round, t) {
  if (!round.declarers) return round.declarations[t];
  const [a, b] = round.declarers[t];
  return { terz: a.terz + b.terz, fifty: a.fifty + b.fifty, deberc: a.deberc + b.deberc, bella: a.bella || b.bella };
}
function scoreRound(round, teams, batons = [0, 0]) {
  const takerTeam = teams.findIndex(t => t.includes(round.trumpTakerId));
  const raw = [0, 1].map(i => round.trickPoints[i] + (round.trickPoints[i] > 0 ? declPoints(teamDecl(round, i)) : 0));
  const lv = raw[0] < LYZHA_LIMIT ? 0 : raw[1] < LYZHA_LIMIT ? 1 : null;
  if (lv !== null) {
    const totals = [];
    totals[lv] = PENALTY;
    totals[1 - lv] = raw[1 - lv];
    return { totals, takerTeam, baton: null, batonNo: 0, lyzha: lv };
  }
  const opp = 1 - takerTeam;
  if (raw[takerTeam] < raw[opp]) {
    const no = batons[takerTeam] + 1;
    const totals = [];
    totals[takerTeam] = no > FREE_BATONS ? PENALTY : 0;
    totals[opp] = raw[0] + raw[1];
    return { totals, takerTeam, baton: takerTeam, batonNo: no, lyzha: null };
  }
  return { totals: raw, takerTeam, baton: null, batonNo: 0, lyzha: null };
}
function callFailed(s) {
  return s.baton !== null || s.lyzha === s.takerTeam;
}
function gameRows(game) {
  let cum = [0, 0];
  const batons = [0, 0];
  return game.rounds.map(r => {
    const s = scoreRound(r, game.teams, batons);
    if (s.baton !== null) batons[s.baton]++;
    cum = [cum[0] + s.totals[0], cum[1] + s.totals[1]];
    return { round: r, ...s, cum: [...cum] };
  });
}
function batonsBefore(game, editId) {
  const b = [0, 0];
  for (const r of game.rounds) {
    if (editId && r.id === editId) break;
    const s = scoreRound(r, game.teams, b);
    if (s.baton !== null) b[s.baton]++;
  }
  return b;
}
function seatingOrder(g) {
  return [g.teams[0][0], g.teams[1][0], g.teams[0][1], g.teams[1][1]];
}
function dealerForRound(g, idx) {
  if (!g.firstDealerId) return null;
  const seats = seatingOrder(g);
  const fi = seats.indexOf(g.firstDealerId);
  return fi === -1 ? null : seats[(fi + idx) % 4];
}
const teamOf = (g, pid) => g.teams.findIndex(t => t.includes(pid));
function callKind(g, round, idx) {
  if (!round.callPhase) return null;
  if (round.forced) return 'left';
  if (round.callPhase === 1) return 'first';
  const dealer = dealerForRound(g, idx);
  if (!dealer) return null;
  return teamOf(g, dealer) === teamOf(g, round.trumpTakerId) ? 'own' : 'foreign';
}
function gameTotals(game) {
  const rows = gameRows(game);
  return rows.length ? rows[rows.length - 1].cum : [0, 0];
}
function detectWinner(totals, target) {
  if (totals[0] < target && totals[1] < target) return null;
  if (totals[0] === totals[1]) return null;
  return totals[0] > totals[1] ? 0 : 1;
}
function allTricksTeam(round) {
  if (round.trickPoints[0] === DEAL_TOTAL) return 0;
  if (round.trickPoints[1] === DEAL_TOTAL) return 1;
  return null;
}
function runSelfTest() {
  const teams = [['a', 'b'], ['c', 'd']];
  const D0 = { terz: 0, fifty: 0, bella: false, deberc: 0 };
  const D = o => ({ ...D0, ...o });
  const R = (taker, tp, d0, d1) => ({ trumpTakerId: taker, trumpSuit: 'h', trickPoints: tp, declarations: [d0 || D0, d1 || D0], kapot: null });
  const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const S = (taker, tp, d0, d1, batons) => scoreRound(R(taker, tp, d0, d1), teams, batons);
  const cases = [
    ['обычная раздача', S('a', [100, 62]), { totals: [100, 62], baton: null }],
    ['батон без комбинаций', S('a', [60, 102]), { totals: [0, 162], baton: 0, batonNo: 1 }],
    ['батон: очки заказчика уходят соперникам', S('a', [60, 102], D({ terz: 1 })), { totals: [0, 182], baton: 0 }],
    ['80 против 82 — батон, соперникам 162', S('a', [80, 82]), { totals: [0, 162], baton: 0 }],
    ['комбинации спасают от батона', S('a', [70, 92], D({ fifty: 1 })), { totals: [120, 92], baton: null }],
    ['белла у соперника заказчика', S('a', [100, 62], D0, D({ bella: true })), { totals: [100, 82], baton: null }],
    ['ничья — каждый пишет своё', S('a', [81, 81]), { totals: [81, 81], baton: null }],
    ['батон второй пары', S('d', [90, 72]), { totals: [162, 0], baton: 1, batonNo: 1 }],
    ['деберц = 100', S('a', [100, 62], D({ deberc: 1 })), { totals: [200, 62], baton: null }],
    ['батон №2 — тоже 0', S('a', [60, 102], D0, D0, [1, 0]), { totals: [0, 162], baton: 0, batonNo: 2 }],
    ['батон №3 — заказчику −100', S('a', [60, 102], D0, D0, [2, 0]), { totals: [-100, 162], baton: 0, batonNo: 3 }],
    ['счётчик у каждой пары свой', S('c', [102, 60], D0, D0, [2, 0]), { totals: [162, 0], baton: 1, batonNo: 1 }],
    ['лыжа перекрывает батон', S('a', [6, 156]), { totals: [-100, 156], baton: null, lyzha: 0 }],
    ['лыжа не заказывавшей пары', S('a', [156, 6]), { totals: [156, -100], baton: null, lyzha: 1 }],
    ['терц спасает от лыжи, но батон', S('a', [6, 156], D({ terz: 1 })), { totals: [0, 182], baton: 0 }],
    ['порог лыжи: 12 — лыжа', S('a', [12, 150]), { totals: [-100, 150], baton: null, lyzha: 0 }],
    ['порог лыжи: 13 — уже батон', S('a', [13, 149]), { totals: [0, 162], baton: 0 }],
    ['все взятки: проигравшим лыжа', S('a', [162, 0]), { totals: [162, -100], baton: null, lyzha: 1 }],
    ['все взятки со своим терцем', S('a', [162, 0], D({ terz: 1 })), { totals: [182, -100], baton: null, lyzha: 1 }],
    ['комбинация без взяток не считается', S('a', [162, 0], D0, D({ terz: 1 })), { totals: [162, -100], baton: null, lyzha: 1 }],
    ['заказчик без взяток: лыжа, не батон', S('c', [162, 0]), { totals: [162, -100], baton: null, lyzha: 1 }]
  ];
  const results = cases.map(([name, got, want]) => ({
    case: name,
    pass: eq(got.totals, want.totals)
      && (want.baton === undefined || got.baton === want.baton)
      && (want.batonNo === undefined || got.batonNo === want.batonNo)
      && (want.lyzha === undefined || got.lyzha === (want.lyzha ?? null)),
    got: JSON.stringify(got.totals) + (got.baton !== null ? ' БАТОН№' + got.batonNo + '/' + got.baton : '') + (got.lyzha !== null ? ' ЛЫЖА' + got.lyzha : ''),
    want: JSON.stringify(want.totals) + (want.baton !== null && want.baton !== undefined ? ' БАТОН' + want.baton : '')
  }));
  const lyzhaGame = { teams, firstDealerId: 'a', rounds: [1, 2, 3].map(i => ({ id: 'r' + i, trumpTakerId: 'a', trumpSuit: 'h', trickPoints: [6, 156], declarations: [D0, D0], kapot: null })).concat([{ id: 'r4', trumpTakerId: 'a', trumpSuit: 'h', trickPoints: [60, 102], declarations: [D0, D0], kapot: null }]) };
  const lr = gameRows(lyzhaGame);
  results.push({
    case: 'три лыжи не дают третий батон',
    pass: lr[3].batonNo === 1 && lr[3].totals[0] === 0 && lr[3].cum[0] === -300,
    got: 'батон №' + lr[3].batonNo + ', раунд ' + JSON.stringify(lr[3].totals) + ', счёт ' + lr[3].cum[0],
    want: 'батон №1, раунд [0,162], счёт -300'
  });
  const gd = { teams, firstDealerId: 'c', rounds: [] };
  const dl = [
    ['раздаёт первый (раунд 1)', dealerForRound(gd, 0), 'c'],
    ['раздаёт по кругу (раунд 2)', dealerForRound(gd, 1), 'b'],
    ['круг замыкается (раунд 5)', dealerForRound(gd, 4), 'c'],
    ['без первого раздающего', dealerForRound({ teams, firstDealerId: null, rounds: [] }, 0), null]
  ];
  dl.forEach(([name, got, want]) => results.push({ case: name, pass: got === want, got: String(got), want: String(want) }));
  const DR = (a, b, c, d) => [[a || D0, b || D0], [c || D0, d || D0]];
  const rd = (taker, tp, declarers, phase, forced) => ({ trumpTakerId: taker, trumpSuit: 'h', trickPoints: tp, declarers: declarers || null, callPhase: phase ?? null, forced: !!forced, kapot: null });
  [
    ['комбинации партнёров складываются', scoreRound(rd('a', [100, 62], DR(D({ terz: 1 }), D({ fifty: 1 }))), teams), [170, 62]],
    ['белла у второго партнёра', scoreRound(rd('a', [100, 62], DR(D0, D({ bella: true }))), teams), [120, 62]],
    ['комбинация партнёра без взяток не считается', scoreRound(rd('c', [0, 162], DR(D({ terz: 1 }), D0)), teams), [-100, 162]]
  ].forEach(([name, got, want]) => results.push({ case: name, pass: eq(got.totals, want), got: JSON.stringify(got.totals), want: JSON.stringify(want) }));
  const kg = { teams, firstDealerId: 'c', rounds: [] };
  [
    ['заказ на 1-м круге', callKind(kg, rd('a', [100, 62], null, 1), 0), 'first'],
    ['раздающего оставили', callKind(kg, rd('c', [100, 62], null, 2, true), 0), 'left'],
    ['полез в свои обязи', callKind(kg, rd('d', [100, 62], null, 2), 0), 'own'],
    ['полез в чужие обязи', callKind(kg, rd('a', [100, 62], null, 2), 0), 'foreign'],
    ['круг не записан — без классификации', callKind(kg, rd('a', [100, 62], null, null), 0), null]
  ].forEach(([name, got, want]) => results.push({ case: name, pass: got === want, got: String(got), want: String(want) }));
  const w = [
    ['победа одной пары', detectWinner([1015, 900], 1010), 0],
    ['обе перешли — большая', detectWinner([1015, 1040], 1010), 1],
    ['обе перешли поровну', detectWinner([1020, 1020], 1010), null],
    ['никто не дошёл', detectWinner([1000, 1009], 1010), null],
    ['минус не мешает победе', detectWinner([-100, 1015], 1010), 1]
  ];
  w.forEach(([name, got, want]) => results.push({ case: name, pass: got === want, got: String(got), want: String(want) }));
  console.table(results);
  return results.every(r => r.pass) ? 'SELF-TEST OK (' + results.length + ')' : 'SELF-TEST FAILED';
}

function modal(opts) {
  return new Promise(res => {
    const w = document.createElement('div');
    w.className = 'backdrop';
    const btns = opts.buttons || [{ key: 'ok', label: 'OK', cls: 'primary' }];
    w.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(opts.title || 'Выберите действие')}">
      ${opts.title ? `<div class="m-title">${opts.title}</div>` : ''}
      ${opts.body ? `<div class="m-body">${opts.body}</div>` : ''}
      ${opts.input !== undefined ? `<input class="m-input" type="text" maxlength="24" value="${esc(opts.input)}">` : ''}
      <div class="m-btns ${opts.stack ? 'm-stack' : ''}">${btns.map(b => `<button class="btn ${b.cls || 'ghost'}" data-k="${b.key}">${b.label}</button>`).join('')}</div>
    </div>`;
    document.getElementById('modal-root').appendChild(w);
    const inp = w.querySelector('.m-input');
    const restoreTo = document.activeElement;
    if (inp) setTimeout(() => { inp.focus(); inp.select(); }, 60);
    else w.querySelector('[data-k]').focus();
    w.addEventListener('click', e => {
      const b = e.target.closest('[data-k]');
      if (b) fin(b.dataset.k);
      else if (e.target === w && opts.dismiss !== false) fin(null);
    });
    const onKey = e => {
      if (e.key === 'Escape' && opts.dismiss !== false) { e.preventDefault(); fin(null); return; }
      if (e.key !== 'Tab') return;
      const f = [...w.querySelectorAll('[data-k], .m-input')];
      const i = f.indexOf(document.activeElement);
      const next = e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i === f.length - 1 ? 0 : i + 1);
      e.preventDefault();
      f[next].focus();
    };
    document.addEventListener('keydown', onKey, true);
    function fin(k) {
      document.removeEventListener('keydown', onKey, true);
      w.remove();
      if (restoreTo && restoreTo.isConnected) restoreTo.focus();
      res({ key: k, value: inp ? inp.value.trim() : null });
    }
  });
}

const CH = { W: 640, H: 300, L: 48, R: 16, T: 16, B: 26 };
function tickStep(m) { for (const s of [50, 100, 200, 250, 500, 1000, 2000]) if (m / s <= 6) return s; return 5000; }
function chartSvg(g, rows, opt = {}) {
  const n = rows.length;
  if (!n) return '';
  const H = opt.h || CH.H;
  const allC = rows.flatMap(r => r.cum);

function bindChart() {

    let i = Math.round((fx - CH.L) / ((CH.W - CH.L - CH.R) / n));

    const x = CH.L + (CH.W - CH.L - CH.R) * i / n;

  svg.addEventListener('pointerdown', show);

function streaks(seq) {
  let cur = 0, best = 0, run = 0;
  for (const w of seq) { run = w ? run + 1 : 0; if (run > best) best = run; }
  for (let i = seq.length - 1; i >= 0 && seq[i]; i--) cur++;
  return { cur, best };
}
function emptyPlayerStats() {
  return {
    games: 0, wins: 0, seq: [], hands: 0, deals: 0,
    calls: 0, callWins: 0, batons: 0, lyzhas: 0,
    suits: { s: 0, c: 0, h: 0, d: 0 },
    kinds: { first: { n: 0, ok: 0 }, left: { n: 0, ok: 0 }, own: { n: 0, ok: 0 }, foreign: { n: 0, ok: 0 } },
    decl: { terz: 0, fifty: 0, deberc: 0, bella: 0 }, declPts: 0, declHands: 0,
    partners: {}
  };
}
function computeStats() {
  const games = finishedGames().slice().sort((a, b) => (a.finishedAt < b.finishedAt ? -1 : 1));
  const P = {}, PAIR = {}, MU = {};
  let detailedHands = 0, phasedHands = 0, totalHands = 0;
  for (const g of games) {
    const keys = g.teams.map(t => t.slice().sort().join('|'));
    for (let ti = 0; ti < 2; ti++) {
      const win = g.winnerTeam === ti;
      g.teams[ti].forEach((pid, si) => {
        const s = P[pid] ??= emptyPlayerStats();
        s.games++; if (win) s.wins++; s.seq.push(win);
        s.hands += g.rounds.length;
        const mate = g.teams[ti][1 - si];
        const pr = s.partners[mate] ??= { games: 0, wins: 0 };
        pr.games++; if (win) pr.wins++;
      });
      const pk = PAIR[keys[ti]] ??= { key: keys[ti], games: 0, wins: 0 };
      pk.games++; if (win) pk.wins++;
    }
    const mk = keys.slice().sort().join('~');
    const m = MU[mk] ??= { keys: keys.slice().sort(), games: 0, wins: {} };
    m.games++;
    m.wins[keys[g.winnerTeam]] = (m.wins[keys[g.winnerTeam]] || 0) + 1;
    gameRows(g).forEach((row, idx) => {
      const r = row.round;
      totalHands++;
      const ps = P[r.trumpTakerId];
      if (ps) {
        ps.calls++;
        if (!callFailed(row)) ps.callWins++;
        if (row.baton !== null) ps.batons++;
        ps.suits[r.trumpSuit]++;
        const kind = callKind(g, r, idx);
        if (kind) {
          ps.kinds[kind].n++;
          if (!callFailed(row)) ps.kinds[kind].ok++;
        }
      }
      if (row.lyzha !== null) g.teams[row.lyzha].forEach(pid => { if (P[pid]) P[pid].lyzhas++; });
      if (callKind(g, r, idx)) phasedHands++;
      const dealer = dealerForRound(g, idx);
      if (dealer && P[dealer]) P[dealer].deals++;
      if (!r.declarers) return;
      detailedHands++;
      [0, 1].forEach(t => r.declarers[t].forEach((d, s) => {
        const pp = P[g.teams[t][s]];
        if (!pp) return;
        pp.declHands++;
        pp.decl.terz += d.terz;
        pp.decl.fifty += d.fifty;
        pp.decl.deberc += d.deberc;
        if (d.bella) pp.decl.bella++;
        pp.declPts += declPoints(d);
      }));
    });
  }
  return { P, PAIR, MU, detailedHands, phasedHands, totalHands };
}

function gameSummary(g) {
  const rows = gameRows(g);
  const w = g.winnerTeam;
  const best = rows.reduce((a, r, i) => (!a || r.totals[w] > a.v ? { v: r.totals[w], n: i + 1 } : a), null);
  const batons = [0, 1].map(t => rows.filter(r => r.baton === t).length);
  const calls = {};
  rows.forEach(r => {
    const c = calls[r.round.trumpTakerId] ??= { n: 0, ok: 0 };
    c.n++;
    if (!callFailed(r)) c.ok++;
  });
  const top = Object.entries(calls).sort((a, b) => b[1].ok - a[1].ok || b[1].n - a[1].n)[0];
  return { rounds: rows.length, best, batons, top };
}

function animateBoard(g) {
  const els = document.querySelectorAll('.tc-score');
  const bars = document.querySelectorAll('.pbar i');
  if (!g || els.length < 2) return;
  if (calmMotion()) { lastBoard = { gid: g.id, totals: [...gameTotals(g)] }; return; }
  const to = gameTotals(g);
  const from = lastBoard && lastBoard.gid === g.id ? lastBoard.totals : to;
  lastBoard = { gid: g.id, totals: [...to] };
  const pctOf = v => Math.max(0, Math.min(100, Math.round(v / g.target * 100)));
  [0, 1].forEach(t => {
    if (from[t] === to[t]) return;
    if (bars[t]) {
      bars[t].style.width = pctOf(from[t]) + '%';
      requestAnimationFrame(() => { bars[t].style.width = pctOf(to[t]) + '%'; });
    }
    const started = performance.now();
    const step = now => {
      const k = Math.min(1, (now - started) / 520);
      els[t].textContent = Math.round(from[t] + (to[t] - from[t]) * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

    const g = data.games.find(x => x.id === victory);
    victory = null;
    g.status = 'active';
    g.winnerTeam = null;
    g.finishedAt = null;
    save();
    const last = g.rounds[g.rounds.length - 1];
    nav('game');
    render();
    ACTIONS.editRound({ rid: last.id });
  },
  statsTab: d => { statsTab = d.tab; render(); },
  addPlayer: async () => { await addPlayerFlow(); render(); },
  renamePlayer: async d => {
    const p = playerById(d.pid);
    const name = await uiPrompt('Имя игрока', p.name);
    if (name && !data.players.some(x => x.id !== p.id && x.name.toLowerCase() === name.toLowerCase())) {
      p.name = name;
      save();
    }
    render();
  },
  toggleArchive: d => {
    const p = playerById(d.pid);
    const g = activeGame();
    if (!p.archived && g && g.teams.flat().includes(p.id)) { toast('Игрок в текущей игре'); return; }
    p.archived = !p.archived;
    save();
    render();
  },
  exportData: () => doExport(),
  pullForce: async () => {
    const ok = await uiConfirm('Заменить серверными', 'Данные на этом устройстве будут заменены копией с сервера без сравнения дат.', 'Заменить', true);
    if (ok) await pullCloud(true);
  }
};

async function doExport() {
  const json = JSON.stringify(data, null, 2);
  const name = 'deberc-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  let done = false;
  if (navigator.canShare) {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); done = true; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
  }
  if (!done) {
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  try { localStorage.setItem('deberc.backupAt', nowIso()); } catch {}
  render();
  toast('Бэкап сохранён');
}
async function doImport(file) {
  let d;
  try { d = JSON.parse(await file.text()); }
  catch { return uiAlert('Ошибка', 'Файл не является корректным JSON.'); }
  if (typeof d.schemaVersion !== 'number' || !Array.isArray(d.players) || !Array.isArray(d.games)) return uiAlert('Ошибка', 'Это не файл бэкапа Дебертца.');
  if (d.schemaVersion > CUR_SCHEMA) return uiAlert('Ошибка', 'Бэкап создан более новой версией приложения.');
  d = migrate(d);
  const ok = await uiConfirm('Импорт данных', `Текущие данные (игр: ${data.games.length}, игроков: ${data.players.length}) будут заменены содержимым файла (игр: ${d.games.length}, игроков: ${d.players.length}).`, 'Заменить', true);
  if (!ok) return;
  try { localStorage.setItem('deberc.prev', JSON.stringify(data)); } catch {}
  data = d;
  save();
  render();
  toast('Данные импортированы');
}

async function syncWakeLock() {
  const want = route() === 'game' && document.visibilityState === 'visible';
  if (want && !wakeLock && 'wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch {}
  } else if (!want && wakeLock) {
    try { await wakeLock.release(); } catch {}
    wakeLock = null;
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el.dataset, el);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]');
  if (!el) return;
  if (el.dataset.input === 'newTarget' && NG) {
    NG.target = el.value.replace(/\D/g, '');
    const btn = document.querySelector('[data-action="startGame"]');
    if (btn) btn.disabled = !(NG.slots.every(Boolean) && parseInt(NG.target, 10) >= 50);
  }
  if (el.dataset.input === 'defaultTarget') {
    const v = parseInt(el.value.replace(/\D/g, ''), 10);
    if (v >= 50 && v <= 100000) { data.settings.defaultTarget = v; save(); }
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  if (el.dataset.change === 'importFile' && el.files[0]) { doImport(el.files[0]); el.value = ''; }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || document.querySelector('#modal-root .backdrop')) return;
  if (sheet) { e.preventDefault(); ACTIONS.sheetClose(); }
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', syncWakeLock);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pullCloud(false, true); });
setInterval(() => { if (!sheet && !victory && document.visibilityState === 'visible') pullCloud(false, true); }, 25000);
window.addEventListener('popstate', () => {
  if (ownNav || (!victory && !sheet)) return;
  victory = null;
  sheet = null;
  renderOverlays();
});
window.addEventListener('hashchange', () => { ownNav = false; render(); });
window.addEventListener('load', () => {
  if (!('serviceWorker' in navigator)) return;
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (had) toast('Доступно обновление', { sticky: true, btn: 'Обновить', action: 'reloadApp' });
  });
});

loadData();
try { localStorage.removeItem('deberc.token'); } catch {}
if (!location.hash) location.replace('#home');
render();
pullCloud(false, true);
</script>
